# FAT reverse proxy — single domain, /api -> backend (3001), everything else -> frontend (3000).
# Place at /etc/nginx/sites-available/fat, symlink into sites-enabled, then run
# `sudo certbot --nginx -d yourdomain.com` to add TLS (certbot rewrites this file).
#
# Replace `yourdomain.com` throughout.

upstream fat_api { server 127.0.0.1:3001; }
upstream fat_web { server 127.0.0.1:3000; }

server {
    listen 80;
    server_name yourdomain.com;

    # Uploaded files are served by the backend under /files.
    client_max_body_size 25m;

    # --- API ---------------------------------------------------------
    location /api/ {
        proxy_pass http://fat_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Server-Sent Events (realtime updates / notifications) need buffering off
        # and a long read timeout so the stream is not cut.
        proxy_set_header Connection        "";
        proxy_buffering                    off;
        proxy_cache                        off;
        proxy_read_timeout                 3600s;
    }

    # Backend-served uploaded files (avatars, attachments, print assets).
    location /files/ {
        proxy_pass http://fat_api;
        proxy_set_header Host $host;
    }

    # --- Frontend (Next.js) -----------------------------------------
    location / {
        proxy_pass http://fat_web;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js HMR / any websocket upgrade.
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}
